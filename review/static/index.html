<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim Critic 审核台</title>
<style>
/* 布局：顶栏（数据集、视图、进度）+ 左侧样本列表 + 右侧详情与编辑。荧光笔标证据，红绿标改动。 */
:root {
  --bg: #f4f5f2; --panel: #ffffff; --ink: #1a211e; --ink-2: #57625c; --rule: #dadfd8;
  --accent: #1f5f5b; --accent-soft: #e1edeb; --marker: #fbe68a; --marker-ink: #1a211e;
  --bad: #b3261e; --bad-soft: #fbe8e6; --good: #1e6b3a; --good-soft: #e4f2e8; --warn: #8a5a00; --warn-soft: #fbf0d9;
  --code: #eef0ec;
  --f: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --mono: "Cascadia Mono", "JetBrains Mono", Consolas, "Microsoft YaHei", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121614; --panel: #1a1f1d; --ink: #e5eae6; --ink-2: #a1aca6; --rule: #2e3532;
    --accent: #7cc4bd; --accent-soft: #1d3331; --marker: #6b5a12; --marker-ink: #fff6cf;
    --bad: #f2867c; --bad-soft: #3a1f1c; --good: #7fd19a; --good-soft: #193022; --warn: #e2b357; --warn-soft: #33290f;
    --code: #222826; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.6 var(--f); display: grid; grid-template-rows: auto 1fr; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
mark { background: var(--marker); color: var(--marker-ink); border-radius: 2px; padding: 0 1px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--ink-2); }

header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--rule); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
select, input[type=text], textarea { background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 8px; }
.views { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--rule); border-radius: 5px; padding: 2px; }
.views button { border: 0; background: transparent; padding: 3px 10px; border-radius: 3px; cursor: pointer; color: var(--ink-2); }
.views button[aria-pressed=true] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }
.progress { display: flex; gap: 10px; align-items: center; margin-left: auto; font-size: 13px; }
.meter { width: 120px; height: 6px; background: var(--code); border-radius: 3px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); }
.chip { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--rule); white-space: nowrap; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

main { display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
#list { border-right: 1px solid var(--rule); overflow-y: auto; background: var(--panel); }
.filters { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.filters input { flex: 1 1 120px; min-width: 0; }
.filters select { flex: 0 1 auto; min-width: 0; max-width: 34%; }
.item { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; gap: 3px; padding: 9px 12px; border-bottom: 1px solid var(--rule); cursor: pointer; border-left: 3px solid transparent; }
.item:hover { background: var(--bg); }
.item[aria-selected=true] { background: var(--accent-soft); border-left-color: var(--accent); }
.item .top { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; min-width: 0; font-size: 11.5px; color: var(--ink-2); }
.item .top .id { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 140px; min-width: 0; }
.item .txt { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.st { width: 8px; height: 8px; border-radius: 50%; flex: none; border: 1.5px solid var(--ink-2); }
.st.accepted { background: var(--good); border-color: var(--good); }
.st.edited { background: var(--accent); border-color: var(--accent); }
.st.rejected { background: var(--bad); border-color: var(--bad); }
.empty { padding: 24px 16px; color: var(--ink-2); }

#detail { overflow-y: auto; padding: 16px 20px 40px; display: grid; gap: 14px; align-content: start; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card h2 { font-size: 13px; margin: 0; color: var(--ink-2); font-weight: 600; letter-spacing: .02em; display: flex; gap: 8px; align-items: center; }
.headrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.headrow .id { font-family: var(--mono); font-size: 13px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.ref { font-size: 13.5px; line-height: 1.7; }
.ref .rid { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); margin-right: 4px; }
.refhead { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.refhead .rid { font-family: var(--mono); font-size: 11.5px; }
.refhead label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.refbox { border-left: 3px solid var(--rule); padding-left: 10px; display: grid; gap: 2px; }
.refbox.cited { border-left-color: var(--accent); }
.gl { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
.gl span { border: 1px solid var(--rule); border-radius: 4px; padding: 1px 6px; }
.gl .hitw { border-color: var(--bad); color: var(--bad); }
.diff del { text-decoration: none; background: var(--good-soft); color: var(--good); border-radius: 2px; padding: 0 2px; }
.diff ins { text-decoration: none; background: var(--bad-soft); color: var(--bad); border-radius: 2px; padding: 0 2px; }
.diff .lbl { font-size: 11.5px; color: var(--ink-2); display: block; }
.form { display: grid; gap: 10px; }
.form label { font-size: 12px; color: var(--ink-2); display: block; margin-bottom: 3px; }
.form textarea { width: 100%; resize: vertical; font-size: 13.5px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.evrow { display: grid; grid-template-columns: 100px 1fr; gap: 6px; }
.changed { box-shadow: inset 3px 0 0 var(--accent); }
.checks { display: grid; gap: 4px; }
.checks ul { margin: 0; padding-left: 18px; }
.err { color: var(--bad); }
.wrn { color: var(--warn); }
.okv { color: var(--good); }
.flags { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.flags label { display: flex; gap: 5px; align-items: center; font-size: 13px; color: var(--ink); cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 5px; padding: 6px 14px; cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--good); border-color: var(--good); color: #fff; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--ink-2); }
.toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 5px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
#selbtn { position: absolute; display: none; z-index: 5; }
details summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
pre.out { white-space: pre-wrap; word-break: break-word; background: var(--code); border-radius: 4px; padding: 8px 10px; margin: 6px 0 0; font-family: var(--mono); font-size: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
td, th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.tbl { overflow-x: auto; }
.dots { display: inline-flex; gap: 4px; vertical-align: middle; }
.dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--bad); }
.dot.hit { background: var(--bad); }
.dot.miss { border-color: var(--ink-2); border-style: dashed; }
.banner { padding: 8px 12px; border-radius: 5px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
  #list { border-right: 0; border-bottom: 1px solid var(--rule); }
  .cols, .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
.flow { display: grid; gap: 10px; }
.step { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; }
.step h3 { margin: 0 0 6px; font-size: 13px; }
.step .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 12.5px; }
.step .kv b { font-weight: 600; color: var(--muted, #666); }
.step .kv div { white-space: pre-wrap; word-break: break-word; }
.call { margin-top: 6px; }
.call pre { white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; font-size: 12px; margin: 4px 0 8px; }
.call .lbl { font-size: 11.5px; font-weight: 600; margin-top: 6px; }
#promptsDlg { width: min(1000px, 94vw); max-height: 88vh; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; padding: 16px 20px; }
#promptsDlg pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--accent-soft); padding: 8px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>Claim Critic 审核台</h1>
  <select id="dataset" aria-label="数据集"></select>
  <div class="views" id="views" role="group" aria-label="视图">
    <button data-v="all" aria-pressed="true">全部</button>
    <button data-v="audit">抽检</button>
    <button data-v="todo">未审</button>
    <button data-v="edited">已修改</button>
    <button data-v="rejected">已拒绝</button>
  </div>
  <div class="progress" id="progress"></div>
  <input type="text" id="reviewer" placeholder="审核人" aria-label="审核人" style="width:90px">
  <button class="btn" id="promptsBtn" type="button">Prompt 模板</button>
</header>
<dialog id="promptsDlg" aria-label="各阶段 prompt 模板"><div id="promptsBody">加载中…</div>
  <form method="dialog" style="text-align:right;margin-top:10px"><button class="btn">关闭</button></form></dialog>
<main>
  <aside id="list">
    <div class="filters">
      <input type="text" id="q" placeholder="搜索 claim 或 id" aria-label="搜索">
      <select id="ftype" aria-label="类型筛选">
        <option value="">全部类型</option><option value="none">faithful</option>
      </select>
      <select id="fround" aria-label="轮次筛选"><option value="">全部轮次</option><option>0</option><option>1</option><option>2</option><option>3</option></select>
    </div>
    <div id="items" role="listbox" aria-label="样本"></div>
  </aside>
  <section id="detail"><div class="empty">选择左侧的一条样本开始审核。快捷键：<kbd>J</kbd>/<kbd>K</kbd> 下一条/上一条，<kbd>A</kbd> 通过，<kbd>R</kbd> 拒绝，<kbd>1</kbd>–<kbd>3</kbd> 切换问题标记，<kbd>Ctrl</kbd>+<kbd>Enter</kbd> 保存修改并通过。</div></section>
</main>
<button class="btn" id="selbtn" type="button">设为证据</button>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let TYPES = [], TYPE_LABELS = {};  // 由 /api/datasets 下发，与 common/schema.py 的 ERROR_TYPES 同源
const state = { dataset: null, view: "all", items: [], idx: -1, detail: null, flags: new Set(), dirty: false, cited: [] };
const sameList = (a, b) => JSON.stringify(a || []) === JSON.stringify(b || []);

document.addEventListener("DOMContentLoaded", () => $("promptsBtn").addEventListener("click", showPrompts));
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw Object.assign(new Error(j.error || r.statusText), { data: j });
  return j;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1800); }

// 词级 LCS diff
function diff(a, b) {
  const tok = s => s.split(/(\s+|(?<=[一-鿿])|(?=[一-鿿]))/).filter(x => x);
  const A = tok(a), B = tok(b), n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ws = x => /^\s+$/.test(x);
  let i = 0, j = 0, oa = "", ob = "";
  while (i < n && j < m) {
    if (A[i] === B[j]) { oa += esc(A[i]); ob += esc(B[j]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { oa += ws(A[i]) ? A[i] : `<del>${esc(A[i])}</del>`; i++; }
    else { ob += ws(B[j]) ? B[j] : `<ins>${esc(B[j])}</ins>`; j++; }
  }
  for (; i < n; i++) oa += ws(A[i]) ? A[i] : `<del>${esc(A[i])}</del>`;
  for (; j < m; j++) ob += ws(B[j]) ? B[j] : `<ins>${esc(B[j])}</ins>`;
  return [oa, ob];
}
function parseEvidence(raw) {
  const m = /^\s*(ref-\d+)\s*[:：]\s*["“「]([\s\S]*)["”」]\s*$/.exec(raw || "");
  return m ? [m[1], m[2]] : ["", raw || ""];
}

// ---------- 数据集与列表 ----------
async function loadDatasets() {
  const d = await api("/api/datasets");
  TYPES = [...d.types, "none"]; TYPE_LABELS = d.type_labels;
  if ($("ftype").options.length <= 2) d.types.forEach(t => $("ftype").add(new Option(`${t} ${TYPE_LABELS[t] || ""}`, t)));
  if (!$("reviewer").value) $("reviewer").value = localGet("reviewer") || d.reviewer || "";
  $("dataset").innerHTML = d.datasets.map(x =>
    `<option value="${x.name}" ${x.exists ? "" : "disabled"}>${x.name}${x.exists ? `（${x.summary.reviewed}/${x.summary.total}）` : "（尚未生成）"}</option>`).join("");
  const qp = new URLSearchParams(location.search);  // ?dataset=hard_batch1&id=... 可直接定位到一条样本
  const want = qp.get("dataset") || localGet("dataset");
  const first = d.datasets.find(x => x.name === want && x.exists) || d.datasets.find(x => x.exists);
  if (first) { $("dataset").value = first.name; state.dataset = first.name; await loadList(qp.get("id")); }
  else $("items").innerHTML = `<div class="empty">还没有任何数据文件。先运行数据流水线（见 README），再刷新本页。</div>`;
}
async function loadList(keepId) {
  const p = new URLSearchParams({ dataset: state.dataset, view: state.view, type: $("ftype").value, round: $("fround").value, q: $("q").value });
  const d = await api("/api/list?" + p);
  state.items = d.items;
  renderProgress(d.summary);
  $("items").innerHTML = d.items.length ? d.items.map((it, i) => `
    <div class="item" role="option" id="it-${i}" data-i="${i}" aria-selected="false">
      <div class="top"><span class="st ${it.status}" title="${it.status}"></span><span class="id">${esc(it.id)}</span>
        ${it.audit ? '<span class="chip acc">抽检</span>' : ""}
        <span class="chip ${it.label === "hallucination" ? "bad" : "good"}">${it.label === "hallucination" ? esc(it.type) : "faithful"}</span>
        ${it.round ? `<span class="chip">r${it.round}</span>` : ""}</div>
      <div class="txt">${esc(it.claim)}</div>
      ${it.flags.length ? `<div class="top">${it.flags.map(f => `<span class="chip warn">${f}</span>`).join("")}</div>` : ""}
    </div>`).join("") : `<div class="empty">这个视图下没有样本。</div>`;
  const k = keepId ? state.items.findIndex(x => x.id === keepId) : 0;
  if (state.items.length) select(Math.max(0, k)); else { state.idx = -1; $("detail").innerHTML = ""; }
}
function renderProgress(s) {
  const pct = s.total ? Math.round(100 * s.reviewed / s.total) : 0;
  let html = `<span>${s.reviewed} / ${s.total} 已审</span><span class="meter" aria-hidden="true"><span style="width:${pct}%"></span></span>`;
  if (s.audit_total != null) html += `<span class="muted">抽检 ${s.audit_reviewed}/${s.audit_total}</span>`;
  if (s.threshold) {
    const t = s.threshold, r = (100 * t.ratio).toFixed(1), lim = (100 * t.limit).toFixed(0);
    html += `<span class="chip ${t.over ? "bad" : "good"}" title="${t.final ? "抽检已完成" : "抽检进行中，比例会变化"}">${t.flag} ${r}% / 阈值 ${lim}%${t.over ? "，超标" : ""}</span>`;
  }
  if (s.rejected) html += `<span class="chip bad">拒 ${s.rejected}</span>`;
  if (s.edited) html += `<span class="chip acc">改 ${s.edited}</span>`;
  $("progress").innerHTML = html;
}

// ---------- 详情 ----------
async function select(i) {
  if (state.dirty && !confirmLeave()) return;
  state.idx = i;
  document.querySelectorAll(".item").forEach(el => el.setAttribute("aria-selected", el.dataset.i == i));
  const el = $("it-" + i); if (el) el.scrollIntoView({ block: "nearest" });
  const d = await api(`/api/sample?dataset=${encodeURIComponent(state.dataset)}&id=${encodeURIComponent(state.items[i].id)}`);
  state.detail = d; state.dirty = false;
  state.flags = new Set(d.review?.flags || []);
  renderDetail();
  loadChain(state.items[i].id);
}

// ---------- 调用流程 ----------
function renderCall(c, k) {
  const outs = c.outputs.length > 1 ? c.outputs.map((o, j) => `<div class="lbl">输出 ${j + 1}</div><pre>${esc(o)}</pre>`).join("")
                                    : `<div class="lbl">输出</div><pre>${esc(c.outputs[0] || "")}</pre>`;
  const u = c.usage, usage = u ? ` · 输入 ${(u.input_tokens || 0) + (u.cache_read_tokens || 0) + (u.cache_write_tokens || 0)} / 输出 ${u.output_tokens || 0} token${u.cost_usd_list ? ` · 标价 $${u.cost_usd_list.toFixed(4)}` : ""}` : "";
  return `<details class="call"><summary>调用 ${k + 1} · ${esc(c.model)}（${esc(c.provider)}）· ${c.secs}s${usage} · ${esc(c.ts)}</summary>
    ${c.system ? `<div class="lbl">system</div><pre>${esc(c.system)}</pre>` : ""}
    <div class="lbl">user</div><pre>${esc(c.user)}</pre>${outs}</details>`;
}
async function loadChain(id) {
  let d;
  try { d = await api(`/api/chain?dataset=${encodeURIComponent(state.dataset)}&id=${encodeURIComponent(id)}`); }
  catch (e) { $("chain").querySelector("div").textContent = "调用流程加载失败：" + e.message; return; }
  if (state.items[state.idx]?.id !== id) return;  // 已切到别的样本
  const box = $("chain");
  const steps = d.steps.map(st => `<div class="step"><h3>${esc(st.title)}${st.calls.length ? ` <span class="chip">${st.calls.length} 次调用</span>` : ""}</h3>
    ${st.data ? `<div class="kv">${Object.entries(st.data).map(([k, v]) => `<b>${esc(k)}</b><div>${String(v).length > 300
        ? `<details><summary>${esc(String(v).slice(0, 80))}…（展开 ${String(v).length} 字）</summary>${esc(v)}</details>` : esc(v)}</div>`).join("")}</div>` : ""}
    ${st.papers ? `<div class="tbl"><table><thead><tr><th>ref</th><th>类型</th><th>年份</th><th>标题</th></tr></thead><tbody>
      ${st.papers.map(p => `<tr><td class="mono">${p.ref}</td><td>${esc(p.kind)}</td><td>${esc(p.year)}</td><td>${esc(p.title)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    ${st.rejected && st.rejected.length ? `<details><summary>判为不相关的候选（${st.rejected.length}）</summary><div class="tbl"><table><tbody>
      ${st.rejected.map(p => `<tr><td>${esc(p.kind)}</td><td>${esc(p.year)}</td><td>${esc(p.title)}</td></tr>`).join("")}</tbody></table></div></details>` : ""}
    ${st.calls.map(renderCall).join("")}</div>`).join("");
  box.innerHTML = box.querySelector("h2").outerHTML + (d.has_trace ? "" : `<div class="banner">配置里没有 trace_dir，只显示数据、不显示模型调用。</div>`)
    + `<div class="flow">${steps || '<div class="muted">没有上游数据。</div>'}</div>`;
}
async function showPrompts() {
  $("promptsDlg").showModal();
  const d = await api("/api/prompts");
  $("promptsBody").innerHTML = `<h2 style="margin-top:0">各阶段 prompt 模板 <span class="muted" style="font-weight:400;font-size:13px">{...} 是运行时填入的字段</span></h2>` +
    d.stages.map(s => `<section style="margin:14px 0"><h3 style="margin:0 0 4px">${esc(s.title)}</h3>
      <div class="muted" style="font-size:12.5px">模型：${esc(s.model)} · 调用：${esc(s.calls)} · 代码：<span class="mono">${esc(s.where)}</span></div>
      ${Object.entries(s.templates).map(([k, v]) => `<details><summary class="mono">${esc(k)}</summary><pre>${esc(v)}</pre></details>`).join("")}</section>`).join("");
}
function confirmLeave() { toast("有未保存的修改，已丢弃"); return true; }

function renderDetail() {
  const d = state.detail, s = d.sample, c = d.current, meta = s.meta || {};
  const [evRef, evText] = (c.evidence || "").trim().toLowerCase() === "none" ? ["none", ""] : parseEvidence(c.evidence);
  const refIds = Object.keys(s.refs);
  const rv = d.review;
  const status = !rv ? '<span class="chip">未审</span>' : rv.decision === "reject" ? '<span class="chip bad">已拒绝</span>' : rv.edits && Object.keys(rv.edits).length ? '<span class="chip acc">已修改并通过</span>' : '<span class="chip good">已通过</span>';
  const critic = meta.critic_outputs || [];
  state.cited = [...d.cited];
  $("detail").innerHTML = `
    <div class="headrow"><span class="id">${esc(s.id)}</span>${status}
      ${c.type === "citation_error" ? `<span class="chip bad">${(c.evidence || "").trim().toLowerCase() === "none" ? "无中生有" : "挂载错误"}</span>` : ""}
      <span class="chip">${esc(s.origin)}</span>${s.round ?`<span class="chip">round ${s.round}</span>` : ""}
      ${meta.detect_rate != null ? `<span class="chip">检出率 ${(meta.detect_rate * 100).toFixed(0)}%</span>` : ""}
      ${meta.rewrites != null ? `<span class="chip">重写 ${meta.rewrites} 次</span>` : ""}
      ${rv ? `<span class="muted" style="font-size:12px">${esc(rv.reviewer || "匿名")} · ${esc(rv.ts)}</span>` : ""}</div>
    ${d.stale ? `<div class="banner">原样本在审核之后被重跑改动过，之前的人工修改不会自动套用，请重新审核。</div>` : ""}
    <div class="cols">
      <div style="display:grid;gap:14px;min-width:0">
        <div class="card" id="chain"><h2>调用流程 <span class="muted" style="font-weight:400">从用户问题到这条样本的每一步；展开可看每次模型调用的 prompt 和输出</span></h2><div class="muted">加载中…</div></div>
        <div class="card"><h2>参考文献 <span class="muted" style="font-weight:400">划选原文可设为证据</span></h2><div id="refs"></div></div>
        ${d.parent ? `<div class="card diff"><h2>与原 claim 的差异</h2><div id="diffbox"></div></div>` : ""}
        ${d.glossary.length ? `<div class="card"><h2>术语表 <span class="muted" style="font-weight:400">critic 输入里附带的词条；红框是词典预检命中的误译</span></h2>
          <div class="gl">${d.glossary.map(g => `<span>${esc(g.en)} = ${esc(g.zh)}</span>`).join("")}
          ${d.term_check.map(t => `<span class="hitw">claim 写成「${esc(t.wrong)}」，应为「${esc(t.zh)}」</span>`).join("")}</div></div>` : ""}
        ${meta.synth_think || meta.judge_think ? `<div class="card"><h2>${meta.synth_think ? "生成模型的改写思路" : "强模型的判定思路"}</h2><div style="font-size:13px">${esc(meta.synth_think || meta.judge_think)}</div></div>` : ""}
        ${critic.length ? `<div class="card"><h2>critic 采样输出 <span class="dots">${critic.map(o => `<span class="dot ${/<verdict>\s*hallucination/.test(o) ? "hit" : "miss"}"></span>`).join("")}</span></h2>
          ${critic.map((o, k) => `<details><summary>第 ${k + 1} 次 · ${/<verdict>\s*hallucination/.test(o) ? "检出" : "漏检"}</summary><pre class="out">${esc(o)}</pre></details>`).join("")}</div>` : ""}
        ${d.lineage.length ? `<div class="card"><h2>同一原 claim 的派生样本（${d.lineage.length}）</h2><div class="tbl"><table>
          <thead><tr><th>数据集</th><th>类型</th><th>轮次</th><th>检出率</th><th>claim</th></tr></thead><tbody>
          ${d.lineage.map(l => `<tr${l.id === s.id && l.dataset === state.dataset ? ' style="background:var(--accent-soft)"' : ""}><td class="mono">${l.dataset}</td><td>${l.type}</td><td>${l.round}</td><td>${l.detect_rate == null ? "" : (l.detect_rate * 100).toFixed(0) + "%"}</td><td>${esc(l.claim)}</td></tr>`).join("")}
          </tbody></table></div></div>` : ""}
      </div>
      <div style="display:grid;gap:14px;min-width:0">
        <div class="card form" id="form">
          <h2>样本内容 <span class="muted" style="font-weight:400">直接修改，左边竖线标出改动过的字段</span></h2>
          <div><label for="f-claim">claim</label><textarea id="f-claim" rows="3">${esc(c.claim)}</textarea></div>
          <div class="row2">
            <div><label for="f-label">label</label><select id="f-label"><option>faithful</option><option>hallucination</option></select></div>
            <div><label for="f-type">type</label><select id="f-type">${TYPES.map(t => `<option value="${t}">${t}${TYPE_LABELS[t] ? " " + TYPE_LABELS[t] : ""}</option>`).join("")}</select></div>
          </div>
          <div><label>引用（在左侧参考文献上勾选）</label><div class="mono" id="citedval"></div></div>
          <div><label for="f-evtext">证据（逐字取自原文；引用错误且哪篇都没有出处时选 none）</label>
            <div class="evrow"><select id="f-evref" aria-label="证据所在文献">${refIds.map(r => `<option>${r}</option>`).join("")}<option value="none">none</option></select>
            <textarea id="f-evtext" rows="2">${esc(evText)}</textarea></div></div>
          <div><label for="f-reason">原因</label><textarea id="f-reason" rows="2">${esc(c.reason)}</textarea></div>
          <div class="checks" id="checks"></div>
        </div>
        <div class="card">
          <h2>问题标记</h2>
          <div class="flags">${d.flags.map((f, k) => `<label><input type="checkbox" data-flag="${f.key}" ${state.flags.has(f.key) ? "checked" : ""}> ${f.label} <kbd>${k + 1}</kbd></label>`).join("")}</div>
          <div><label for="f-note" style="font-size:12px;color:var(--ink-2)">备注</label><textarea id="f-note" rows="2" style="width:100%">${esc(rv?.note || "")}</textarea></div>
          <div class="actions">
            <button class="btn primary" id="b-accept" type="button">通过 <kbd style="color:inherit;border-color:currentColor">A</kbd></button>
            <button class="btn danger" id="b-reject" type="button">拒绝 <kbd>R</kbd></button>
            <button class="btn" id="b-reset" type="button">撤销修改</button>
            <span class="muted" style="font-size:12px;margin-left:auto">保存后自动跳到下一条</span>
          </div>
        </div>
        ${d.history.length > 1 ? `<div class="card"><h2>审核历史（${d.history.length}）</h2><div class="tbl"><table><thead><tr><th>时间</th><th>审核人</th><th>结论</th><th>标记</th><th>修改字段</th></tr></thead><tbody>
          ${d.history.slice().reverse().map(h => `<tr><td>${esc(h.ts)}</td><td>${esc(h.reviewer)}</td><td>${h.decision}</td><td>${h.flags.join(", ")}</td><td>${Object.keys(h.edits || {}).join(", ")}</td></tr>`).join("")}
          </tbody></table></div></div>` : ""}
      </div>
    </div>`;
  $("f-label").value = c.label; $("f-type").value = c.type || "none";
  $("f-evref").value = (c.evidence || "").trim().toLowerCase() === "none" ? "none" : evRef || refIds[0];
  $("f-evtext").disabled = $("f-evref").value === "none";
  bindForm();
  showValidation(d.validation);
  markChanged();
}

function formValues() {
  const label = $("f-label").value, evRef = $("f-evref").value;
  return {
    claim: $("f-claim").value.trim(), label,
    cited: [...state.cited],
    type: label === "faithful" ? "none" : $("f-type").value,
    evidence: evRef === "none" ? "none" : $("f-evtext").value.trim() ? `${evRef}: "${$("f-evtext").value.trim()}"` : "",
    reason: $("f-reason").value.trim(),
  };
}
function origCited() { const s = state.detail.sample; return s.cited ?? Object.keys(s.refs); }
function edits() {
  const s = state.detail.sample, v = formValues(), out = {};
  for (const k of Object.keys(v)) {
    if (k === "cited") { if (!sameList(v.cited, origCited())) out.cited = v.cited; }
    else if ((v[k] || "") !== (s[k] || "")) out[k] = v[k];
  }
  return out;
}
function markChanged() {
  const e = edits();
  [["claim", "f-claim"], ["label", "f-label"], ["type", "f-type"], ["evidence", "f-evtext"], ["reason", "f-reason"], ["cited", "citedval"]]
    .forEach(([k, id]) => $(id).parentElement.classList.toggle("changed", k in e));
  $("citedval").textContent = state.cited.length ? state.cited.join(", ") : "无（句子没有标注引用）";
  if ($("diffbox")) {
    const p = state.detail.parent, [a, b] = diff(p.claim, $("f-claim").value);
    const pc = state.detail.parent_cited || [], cc = state.cited;
    const cite = sameList(pc, cc) ? "" : `<span class="lbl" style="margin-top:6px">引用</span><div class="mono"><del>${esc(pc.join(", ") || "无")}</del> → <ins>${esc(cc.join(", ") || "无")}</ins></div>`;
    $("diffbox").innerHTML = `<span class="lbl">原 claim（正样本 ${esc(p.id)}）</span><div>${a}</div><span class="lbl" style="margin-top:6px">当前 claim</span><div>${b}</div>${cite}`;
  }
}
function renderRefs(span) {
  const d = state.detail;
  $("refs").innerHTML = Object.entries(d.refs_display).map(([id, t]) => {
    let body = esc(t);
    if (span && span[0] === id) body = esc(t.slice(0, span[1])) + "<mark>" + esc(t.slice(span[1], span[2])) + "</mark>" + esc(t.slice(span[2]));
    const on = state.cited.includes(id);
    return `<div class="refbox ${on ? "cited" : ""}" data-ref="${id}">
      <div class="refhead"><span class="rid">${id}</span><label><input type="checkbox" data-cite="${id}" ${on ? "checked" : ""}> ${on ? "被引用" : "对照（未引用）"}</label></div>
      <p class="ref" style="margin:0">${body}</p></div>`;
  }).join("");
  document.querySelectorAll("[data-cite]").forEach(cb => cb.addEventListener("change", () => {
    const ids = Object.keys(d.refs_display);
    state.cited = ids.filter(r => r === cb.dataset.cite ? cb.checked : state.cited.includes(r));
    revalidate();
  }));
}
function showValidation(v) {
  renderRefs(v.evidence_span);
  const items = [...v.errors.map(e => `<li class="err">${esc(e)}</li>`), ...v.warnings.map(w => `<li class="wrn">${esc(w)}</li>`)];
  $("checks").innerHTML = items.length ? `<ul>${items.join("")}</ul>` :
    `<span class="okv">校验通过${v.edit_distance != null ? `，编辑距离 ${v.edit_distance}` : ""}</span>`;
  $("b-accept").disabled = v.errors.length > 0;
  $("b-accept").title = v.errors.length ? "先修正校验错误，或者直接拒绝" : "";
}
let vTimer;
function revalidate() {
  state.dirty = Object.keys(edits()).length > 0;
  markChanged();
  clearTimeout(vTimer);
  vTimer = setTimeout(async () => showValidation(await api("/api/validate", { dataset: state.dataset, id: state.detail.sample.id, edits: edits() })), 200);
}
function bindForm() {
  ["f-claim", "f-evtext", "f-reason", "f-note"].forEach(id => $(id).addEventListener("input", revalidate));
  ["f-label", "f-type", "f-evref"].forEach(id => $(id).addEventListener("change", () => {
    if (id === "f-label") { const f = $("f-label").value === "faithful"; $("f-type").disabled = f; if (f) $("f-type").value = "none"; else if ($("f-type").value === "none") $("f-type").value = TYPES[0]; }
    $("f-evtext").disabled = $("f-evref").value === "none";
    revalidate();
  }));
  $("f-type").disabled = $("f-label").value === "faithful";
  document.querySelectorAll("[data-flag]").forEach(cb => cb.addEventListener("change", () => cb.checked ? state.flags.add(cb.dataset.flag) : state.flags.delete(cb.dataset.flag)));
  $("b-accept").onclick = () => save("accept");
  $("b-reject").onclick = () => save("reject");
  $("b-reset").onclick = () => { state.detail.current = state.detail.sample; state.dirty = false; renderDetail(); revalidate(); };
}

async function save(decision) {
  const id = state.detail.sample.id;
  try {
    localSet("reviewer", $("reviewer").value);
    await api("/api/review", { dataset: state.dataset, id, decision, flags: [...state.flags], edits: decision === "reject" ? {} : edits(), note: $("f-note").value, reviewer: $("reviewer").value });
    state.dirty = false;
    toast(decision === "reject" ? "已拒绝" : Object.keys(edits()).length ? "已保存修改并通过" : "已通过");
    const next = state.items[state.idx + 1]?.id;
    await loadList(state.view === "all" || state.view === "audit" ? next || id : null);
  } catch (e) {
    toast(e.message);
    if (e.data?.validation) showValidation(e.data.validation);
  }
}

// 划选原文 → 设为证据
document.addEventListener("mouseup", e => {
  const btn = $("selbtn");
  if (e.target === btn) return;
  const sel = window.getSelection(), text = sel.toString().trim();
  const p = sel.anchorNode && sel.anchorNode.parentElement?.closest("[data-ref]");
  if (!text || !p || !$("refs")?.contains(p)) { btn.style.display = "none"; return; }
  const r = sel.getRangeAt(0).getBoundingClientRect();
  btn.style.left = `${window.scrollX + r.left}px`; btn.style.top = `${window.scrollY + r.bottom + 6}px`; btn.style.display = "block";
  btn.onclick = () => { $("f-evref").value = p.dataset.ref; $("f-evtext").value = text.replace(/^\(ref-\d+\)/, "").trim(); btn.style.display = "none"; revalidate(); };
});

// 快捷键
document.addEventListener("keydown", e => {
  if (!state.detail) return;
  if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); if (!$("b-accept").disabled) save("accept"); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "j" && state.idx < state.items.length - 1) select(state.idx + 1);
  else if (k === "k" && state.idx > 0) select(state.idx - 1);
  else if (k === "a" && !$("b-accept").disabled) save("accept");
  else if (k === "r") save("reject");
  else if (/^[1-9]$/.test(k)) { const cb = document.querySelectorAll("[data-flag]")[+k - 1]; if (cb) { cb.click(); } }
  else return;
  e.preventDefault();
});

function localGet(k) { try { return localStorage.getItem("cc." + k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem("cc." + k, v); } catch {} }

$("dataset").addEventListener("change", () => { state.dataset = $("dataset").value; localSet("dataset", state.dataset); loadList(); });
$("views").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  state.view = b.dataset.v;
  document.querySelectorAll("#views button").forEach(x => x.setAttribute("aria-pressed", x === b));
  loadList();
});
["ftype", "fround"].forEach(id => $(id).addEventListener("change", () => loadList()));
let qTimer; $("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => loadList(), 250); });
$("items").addEventListener("click", e => { const it = e.target.closest(".item"); if (it) select(+it.dataset.i); });
loadDatasets();
</script>
</body>
</html>
