# 数据构建全部阶段的配置。路径里的 {batch} 由脚本按批次填入。

fetch:
  out: outputs/data/groups.jsonl
  seed: 0
  topics:            # 每个主题一个检索式，按需扩充
    - type 2 diabetes metformin
    - hypertension elderly
    - statin cardiovascular prevention
    - breast cancer neoadjuvant chemotherapy
    - sepsis early antibiotics
    - depression SSRI adolescents
    - asthma inhaled corticosteroids children
    - atrial fibrillation anticoagulation
  papers_per_topic: 400
  min_group: 3
  max_group: 8
  max_section_chars: 4000
  test_group_ratio: 0.1   # 测试集文献组，与训练集不重叠

generator:               # 综述生成、负样本合成
  model: Qwen/Qwen3-32B
  base_url: http://localhost:8000/v1
  temperature: 0.7
  max_tokens: 2048
  concurrency: 32

judge:                   # 正样本判定，只跑一次
  model: Qwen/Qwen3-235B-A22B
  base_url: http://localhost:8001/v1
  api_key_env: OPENAI_API_KEY
  max_tokens: 2048
  concurrency: 16

critic_server:           # 难样本挖掘时的 critic，按轮次起服务
  model: critic-{round}
  base_url: http://localhost:8002/v1
  temperature: 1.0
  max_tokens: 1024
  concurrency: 64

gen_review:
  out: outputs/data/reviews.jsonl
  versions: 2
  temperature: 0.7
  language: zh          # zh | en；中文综述才有 term_error

# 术语词典固定读 configs/glossary.tsv（common/glossary.py），训练、推理共用；换词典用环境变量 CRITIC_GLOSSARY

split_claims:
  out: outputs/data/claims.jsonl
  # 对照文献篇数由命令行 --context_k 指定（默认 2），推理 infer/judge.py 要用同一个值

label_positive:
  out: outputs/data/positives.jsonl
  audit_out: outputs/audit/positives_audit.jsonl
  audit_ratio: 0.05
  max_audit_error: 0.03

synth_negative:
  out: outputs/data/synth_batch{batch}.jsonl
  example_pool: configs/negative_examples.jsonl
  positives_per_batch: 15000
  per_positive: 2       # 每条正样本派生几条负样本；类型在「该正样本能合成的类型」里按全局用量轮转
  n_examples: 3
  min_edit: 1
  max_edit: 40

mine_hard:
  out: outputs/data/hard_batch{batch}.jsonl
  audit_out: outputs/audit/hard_batch{batch}_audit.jsonl
  n_samples: 4                    # critic 对每条采样 4 次
  keep_if_detect_rate_below: 0.5  # 检出率低于 0.5 视为漏检，入库
  max_rewrites: 2
  audit_size: 200
  max_not_error_ratio: 0.10

build_trainset:
  out: outputs/data/trainset_v{version}
  coldstart_out: outputs/data/coldstart.jsonl
  coldstart_size: 2000
  max_per_class: 15000
  max_last_round_ratio: 0.4
  val_ratio: 0.05
  uncited_ratio: 0.1    # 这部分正样本和「无中生有」负样本去掉引用标注（cited=[]），覆盖推理时没标引用的句子

review:                  # 人工审核记录，python -m review.server 写入，build_trainset 读取
  dir: outputs/review
