# verl 单卡冒烟测试：在 docker 的 verl 容器里跑（见 docker/README.md），Qwen3-0.6B，5 步
init_model: outputs/smoke/ckpt/critic-0
data_dir: outputs/smoke/trainset_v{version}
output_dir: outputs/smoke/ckpt/grpo-v{version}
project_name: claim-critic
experiment_prefix: smoke

train_batch_size: 2
ppo_mini_batch_size: 2
group_size: 4
temperature: 1.0
max_prompt_length: 2560
max_response_length: 384
lr: 1.0e-5
kl_coef: 0.01
total_steps: 5
test_freq: -1
save_freq: -1

n_gpus: 1
rollout_tp: 1
rollout_gpu_mem: 0.3      # 12 GB 卡：vLLM 只占 30%，剩下给 FSDP 训练

lora_rank: 16             # 全参数要把优化器卸载到内存（约 7 GB），WSL 下 Windows 内存额度不够；LoRA 几乎不占
lora_alpha: 32

extra_overrides:
  actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: 1
  actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: 2
  actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu: 2
  actor_rollout_ref.model.enable_gradient_checkpointing: true
  actor_rollout_ref.rollout.load_format: safetensors   # verl LoRA 要求
  actor_rollout_ref.rollout.layered_summon: false   # 单卡 FSDP1 是 NO_SHARD，按层收集取不到 LoRA 参数，回退路径又不支持 offload_to_cpu
  actor_rollout_ref.rollout.max_model_len: 3072
  actor_rollout_ref.rollout.checkpoint_engine.update_weights_bucket_megabytes: 512   # WSL 走共享内存传权重时，单个权重（词表约 311 MB）必须放得进一个桶
  actor_rollout_ref.rollout.enforce_eager: true   # WSL 下 CUDA graph 捕获会额外占显存
  trainer.logger: "['console']"
  # verl 0.9 默认各起 8 个 agent loop / reward / dataloader 进程，每个都加载 torch，12 GB 内存装不下
  actor_rollout_ref.rollout.agent.num_workers: 1
  reward.num_workers: 1
  data.dataloader_num_workers: 0
  +ray_kwargs.ray_init.object_store_memory: 1000000000   # Ray 对象存储默认占内存 30%，冒烟测试 1 GB 足够
  trainer.val_before_train: false
