# 小规模试跑：2 个主题 × 4 种意图、约 50 组文献，生成与判定走 Claude（默认 claude -p），先看真实质量和花费再决定是否放大。
# 结构与 data.yaml 相同；产出全部在 outputs/trial/，与正式数据隔离。

trace_dir: outputs/trial/traces   # 记录每次模型调用的 prompt 和输出，审核台展示调用链

build_groups:            # 按意图构造文献组（data.build_groups）：主题 × 意图 → 问题 → 按文献类型检索
  out: outputs/trial/groups.jsonl
  questions_out: outputs/trial/questions.jsonl
  relevance_out: outputs/trial/relevance.jsonl   # 模型判相关性的结果缓存
  seed: 0
  topics:
    - type 2 diabetes treatment with metformin
    - anticoagulation in atrial fibrillation
  intents: [frontier, progress, overview, medication]   # 定义见 data/intents.py
  questions_per_intent: 7
  min_group: 3
  max_group: 7
  candidate_pool: 60     # 每个问题先取相关度前 60 篇候选，再按文献类型、标题含检索词筛
  relevance_candidates: 15   # 规则筛完后最多 15 篇交给模型判相关性
  max_section_chars: 4000
  max_label_chars: 6000   # FDA 说明书只取主要章节的前 6000 字符
  test_group_ratio: 0.1

# provider: claude_cli 用本机已登录的 Claude Code（claude -p，占订阅额度、不另计费）；
# 正式规模换 provider: anthropic + api_key_env: ANTHROPIC_API_KEY（按量计费）。
generator:               # 综述生成、负样本合成
  provider: claude_cli
  model: claude-opus-5-5
  effort: medium         # Opus 5.5 思考不能关，用 effort 控深浅
  max_tokens: 16000      # 仅 anthropic 用；思考也计入，要留余量
  concurrency: 4         # 订阅额度有限，并发别开太大

judge:                   # 正样本判定
  provider: claude_cli
  model: claude-opus-5-5
  effort: high           # 判定是质量关口，effort 比生成高一档
  max_tokens: 16000
  concurrency: 4

critic_server:           # 自训 critic，仍由本地 vLLM 部署（docker/compose.yaml 的 vllm 服务）
  model: critic-{round}
  base_url: http://127.0.0.1:8002/v1
  temperature: 1.0
  max_tokens: 1024
  concurrency: 16

gen_review:
  out: outputs/trial/reviews.jsonl
  versions: 1
  temperature: 0.7       # anthropic 后端忽略
  language: zh

split_claims:
  out: outputs/trial/claims.jsonl

label_positive:
  out: outputs/trial/positives.jsonl
  audit_out: outputs/trial/audit/positives_audit.jsonl
  audit_ratio: 0.1
  max_audit_error: 0.03

synth_negative:
  out: outputs/trial/synth_batch{batch}.jsonl
  example_pool: configs/negative_examples.jsonl
  positives_per_batch: 300
  per_positive: 2
  n_examples: 3
  min_edit: 1
  max_edit: 40

mine_hard:
  out: outputs/trial/hard_batch{batch}.jsonl
  audit_out: outputs/trial/audit/hard_batch{batch}_audit.jsonl
  n_samples: 4
  keep_if_detect_rate_below: 0.5
  max_rewrites: 2
  audit_size: 50
  max_not_error_ratio: 0.10

build_trainset:
  out: outputs/trial/trainset_v{version}
  coldstart_out: outputs/trial/coldstart.jsonl
  coldstart_size: 400
  max_per_class: 2000
  max_last_round_ratio: 0.4
  val_ratio: 0.05
  uncited_ratio: 0.1

review:
  dir: outputs/trial/review
