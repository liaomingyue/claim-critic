# MiniCPM5-2B 造错生成器 SFT，种子第五版（2026-11-03，用户：critic 判不出的只有 108 条，快速补到 172 条左右）：第三版种子 + hardpool 里没进种子的 61 句
# 按上下文改对（Claude 7 次调用）后，只留 2B critic 判不出的，共 151 条（长度上限放到 14000 字符）。其余同 sft_gen_seed4_mc，单卡 1 轮。
task: gen
prompt_tips: false
base_model: /root/autodl-fs/models/MiniCPM5-2B
use_lora: true
merge_lora: true
eos_tokens: ["<|im_end|>"]
lora:
  r: 16
  lora_alpha: 32
  target_modules: all-linear
  task_type: CAUSAL_LM

trainer:
  num_train_epochs: 1
  learning_rate: 5.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  bf16: true
  gradient_checkpointing: true
  max_length: 4096
  logging_steps: 2
  save_strategy: "no"
  report_to: none
  seed: 0
  model_init_kwargs:
    dtype: bfloat16
    device_map: cuda

coldstart:
  data: outputs/rt/gentarget/seed2b/sft_train_v5.jsonl
  output_dir: /root/autodl-tmp/ckpt/gen-seed5-mc
