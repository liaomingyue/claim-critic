# 方向 B（迭代难样本 SFT）：原 SFT 数据 + v2h 批量采样里「过门槛、critic 0.1–0.5、sev 判要求类型 ≥ 0.5」的样本（+ 上一轮难样本里同样满足的）。
# 超参同 sft_gen_v2_mc（1 轮、lr 5e-5、有效批 4），从基座重训一个 LoRA。
task: gen
prompt_tips: false
base_model: /root/autodl-tmp/models/MiniCPM5-2B   # 本地盘（共享盘随机读太慢，加载权重要约 2 小时）
use_lora: true
merge_lora: false
eos_tokens: ["<|im_end|>"]
lora:
  r: 16
  lora_alpha: 32
  target_modules: all-linear
  task_type: CAUSAL_LM

trainer:
  num_train_epochs: 1
  learning_rate: 5.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  bf16: true
  gradient_checkpointing: true
  max_length: 4096
  logging_steps: 2
  save_strategy: "no"
  report_to: none
  seed: 0
  model_init_kwargs:
    dtype: bfloat16
    device_map: cuda

coldstart:
  data: outputs/rt/gen_v2_grpo/sft_hard_v2.jsonl
  output_dir: /root/autodl-tmp/ckpt/gen-v2h2-mc
