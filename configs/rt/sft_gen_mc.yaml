# MiniCPM5-2B 造错生成器 SFT（2026-11-03，定向造错 GRPO 的起点）：同 gen-seed（sft_gen_free_9b + 1 epoch、lr 5e-5，数据 sft_train_seed_f.jsonl），只换底座、批大小 2 × 8（4096 长度下 13 万词表的 logits 大，每次 2 条）。
# 数据由 ragtruth.realgen build --free 产出，prompt 与生成器采样 / DPO 的统一 prompt 一致。超参同 9B v2 critic。
task: gen
prompt_tips: false
base_model: /root/autodl-fs/models/MiniCPM5-2B
use_lora: true
merge_lora: true
eos_tokens: ["<|im_end|>"]
lora:
  r: 16
  lora_alpha: 32
  target_modules: all-linear
  task_type: CAUSAL_LM

trainer:
  num_train_epochs: 1
  learning_rate: 5.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  bf16: true
  gradient_checkpointing: true
  max_length: 4096          # build 时已丢掉约 4k token 以上的样本（--max_chars 14000），这里不会截到输出
  logging_steps: 2
  save_strategy: "no"
  report_to: none
  seed: 0
  model_init_kwargs:
    dtype: bfloat16
    device_map: cuda

coldstart:
  data: outputs/rt/realgen/sft_train_seed_f.jsonl
  output_dir: /root/autodl-tmp/ckpt/gen-seed-mc
