# 错误改写模型 v0 的 9B 版（2026-11-08，用户：是不是 2B 太差，用同一份种子集 D3 训 9B 看效果）。
# 数据同 gen-core-mc（outputs/rt/core/seed_sft_train.jsonl，1338 条）；超参沿用旧 9B 生成器 sft_gen_real_9b（lr 1e-4、有效批 16），轮数按用户改为 1 轮（同 2B）。
# 只存 LoRA 适配器，vLLM 带适配器起服务（serve_loras.sh 去掉视觉塔参数）。
task: gen
prompt_tips: false
base_model: /root/autodl-tmp/models/Qwen3.5-9B
use_lora: true
merge_lora: false
eos_tokens: ["<|im_end|>"]
lora:
  r: 16
  lora_alpha: 32
  target_modules: all-linear
  task_type: CAUSAL_LM

trainer:
  num_train_epochs: 1
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  bf16: true
  gradient_checkpointing: true
  max_length: 4096
  logging_steps: 2
  save_strategy: "no"
  report_to: none
  seed: 0
  model_init_kwargs:
    dtype: bfloat16
    device_map: cuda

coldstart:
  data: outputs/rt/core/seed_sft_train.jsonl
  output_dir: /root/autodl-tmp/ckpt/gen-core-9b
