# 错误合成模型，按错误操作清单下指令：输入 = 原文 + 完整回答 + 20 种操作之一；输出 = 第几句 + 改写句 + 改动描述（ragtruth/gen_ops.py）。
# 2B 版，超参同 sft_gen_v2_mc（1 轮、lr 5e-5、有效批 4）。
task: gen
prompt_tips: false
base_model: /root/autodl-fs/models/MiniCPM5-2B
use_lora: true
merge_lora: false
eos_tokens: ["<|im_end|>"]
lora:
  r: 16
  lora_alpha: 32
  target_modules: all-linear
  task_type: CAUSAL_LM

trainer:
  num_train_epochs: 1
  learning_rate: 5.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  bf16: true
  gradient_checkpointing: true
  max_length: 4096
  logging_steps: 2
  save_strategy: "no"
  report_to: none
  seed: 0
  model_init_kwargs:
    dtype: bfloat16
    device_map: cuda

coldstart:
  data: outputs/rt/core/seed_ops_train.jsonl
  output_dir: /root/autodl-tmp/ckpt/gen-ops-mc
