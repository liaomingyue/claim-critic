# 错误生成器 SFT，自由选择版：输入修复后的整条回答（不指定句子、类型、改法），输出真实的句号、类型、改法、错句及分析 JSON。
# 数据由 ragtruth.realgen build --free 产出，prompt 与生成器采样 / DPO 的统一 prompt 一致。超参同 9B v2 critic。
task: gen
prompt_tips: false
base_model: /root/autodl-tmp/models/Qwen3.5-9B
use_lora: true
merge_lora: true
eos_tokens: ["<|im_end|>"]
lora:
  r: 16
  lora_alpha: 32
  target_modules: all-linear
  task_type: CAUSAL_LM

trainer:
  num_train_epochs: 2
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  bf16: true
  gradient_checkpointing: true
  max_length: 4096          # build 时已丢掉约 4k token 以上的样本（--max_chars 14000），这里不会截到输出
  logging_steps: 2
  save_strategy: "no"
  report_to: none
  seed: 0
  model_init_kwargs:
    dtype: bfloat16
    device_map: cuda

coldstart:
  data: outputs/rt/realgen/sft_train_free.jsonl
  output_dir: /root/autodl-tmp/ckpt/gen-sft-free
