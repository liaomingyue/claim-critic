# 错误改写模型第二版格式，9B 版：数据同 sft_gen_v2_mc（seed_v2_train.jsonl），超参同 sft_gen_core_9b（1 轮、lr 1e-4、有效批 16），只存 LoRA。
task: gen
prompt_tips: false
base_model: /root/autodl-tmp/models/Qwen3.5-9B
use_lora: true
merge_lora: false
eos_tokens: ["<|im_end|>"]
lora:
  r: 16
  lora_alpha: 32
  target_modules: all-linear
  task_type: CAUSAL_LM

trainer:
  num_train_epochs: 1
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  bf16: true
  gradient_checkpointing: true
  max_length: 4096
  logging_steps: 2
  save_strategy: "no"
  report_to: none
  seed: 0
  model_init_kwargs:
    dtype: bfloat16
    device_map: cuda

coldstart:
  data: outputs/rt/core/seed_v2_train.jsonl
  output_dir: /root/autodl-tmp/ckpt/gen-v2-9b
