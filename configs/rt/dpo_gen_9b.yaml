# 错误合成模型（生成器）DPO：Qwen3.5-9B + LoRA，偏好对来自 ragtruth.gen_dpo pairs（技术报告 Q4 / Q6）。
# beta 0.1 为 DPO 常用值；1 个 epoch，偏好对约几千条；学习率比 SFT 低一个量级，防止偏离参考模型太远。
base_model: /root/autodl-tmp/models/Qwen3.5-9B
data: outputs/rt/dpo/base/pairs_hard.jsonl
output_dir: /root/autodl-tmp/ckpt/gen-9b-dpo
lora:
  r: 16
  lora_alpha: 32
  target_modules: all-linear
  task_type: CAUSAL_LM
trainer:
  beta: 0.1
  num_train_epochs: 1
  learning_rate: 5.0e-6
  lr_scheduler_type: cosine
  warmup_steps: 0.05
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  bf16: true
  gradient_checkpointing: true
  max_length: 4096
  logging_steps: 2
  save_strategy: "no"
  report_to: none
  seed: 0
  model_init_kwargs:
    dtype: bfloat16
    device_map: cuda
