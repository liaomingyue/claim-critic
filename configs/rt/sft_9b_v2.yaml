# RAGTruth 主线 SFT：Qwen3.5-9B + LoRA，AutoDL 单卡 RTX 5090（32 GB）。
# 数据与本地 0.6B 基线完全相同（3,003 条逐句样本），只换基座和 batch，结果可直接对比。
# Qwen3.5-9B 是图文统一模型（Qwen3_5ForConditionalGeneration，线性注意力 + 普通注意力混合），
# LoRA 只挂语言模型的线性层，视觉塔不动（target_modules 见下）。
task: ragtruth
prompt_tips: false
base_model: /root/autodl-tmp/models/Qwen3.5-9B
use_lora: true
merge_lora: true
eos_tokens: ["<|im_end|>"]
lora:
  r: 16
  lora_alpha: 32
  target_modules: all-linear          # 实测按纯文本 Qwen3_5ForCausalLM 加载，没有视觉塔；含线性注意力的 in_proj_*、out_proj
  task_type: CAUSAL_LM

trainer:
  num_train_epochs: 2
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  per_device_train_batch_size: 1    # 实测 1 条 1.2k token 前向+反向峰值 21 GB（32 GB 卡）
  gradient_accumulation_steps: 16
  bf16: true
  gradient_checkpointing: true
  max_length: 3072
  logging_steps: 2
  save_strategy: "no"
  report_to: none
  seed: 0
  model_init_kwargs:        # 让 TRL 加载时直接放到 GPU；不指定时部分权重停在 meta 设备，反向报 expected device meta
    dtype: bfloat16
    device_map: cuda

coldstart:
  data: outputs/rt/claims/train_sub35_r3.jsonl   # v2：35B 补写 + 一致性校验，去掉粗粒度/存疑句，1:3
  output_dir: /root/autodl-tmp/ckpt/sft-9b-v2-notips
