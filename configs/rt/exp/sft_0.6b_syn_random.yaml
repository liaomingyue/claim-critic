# 合成错误样本实验（0.6B，5090）：syn-random — 在 e3 训练集（train_sub35_nat）上成对加入合成样本（ragtruth.mine mix --arm random）
task: ragtruth
style: full
prompt_tips: false
base_model: /root/autodl-tmp/models/Qwen3-0.6B
use_lora: true
merge_lora: true
eos_tokens: ["<|im_end|>"]
lora:
  r: 16
  lora_alpha: 32
  target_modules: all-linear
  task_type: CAUSAL_LM

trainer:
  num_train_epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  bf16: true
  gradient_checkpointing: true
  max_length: 4096
  logging_steps: 5
  save_strategy: "no"
  report_to: none
  seed: 0
  model_init_kwargs:
    dtype: bfloat16
    device_map: cuda

coldstart:
  data: outputs/rt/claims/syn_r1_random.jsonl
  output_dir: /root/autodl-tmp/ckpt/sft-0.6b-syn-random
