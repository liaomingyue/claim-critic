# 格式对比实验（0.6B，5090）：e5 — task=ragtruth_resp, style=evidence
# ② e2：逐句，只判定，自然比例；③ e3：逐句，evidence+reason，自然比例；
# ⑤ e5：回答级，每句一行证据；⑤b e5b：回答级，只给有问题的句子（与 e5 同一批 774 条回答）。
task: ragtruth_resp
style: evidence
prompt_tips: false
base_model: /root/autodl-tmp/models/Qwen3-0.6B
use_lora: true
merge_lora: true
eos_tokens: ["<|im_end|>"]
lora:
  r: 16
  lora_alpha: 32
  target_modules: all-linear
  task_type: CAUSAL_LM

trainer:
  num_train_epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  bf16: true
  gradient_checkpointing: true
  max_length: 4608          # 回答级带证据：最长样本约 4.1k token
  logging_steps: 5
  save_strategy: "no"
  report_to: none
  seed: 0
  model_init_kwargs:
    dtype: bfloat16
    device_map: cuda

coldstart:
  data: outputs/rt/resp/train_full.jsonl
  output_dir: /root/autodl-tmp/ckpt/sft-0.6b-e5
