# 诊断实验 ④ e4（0.6B，5090）：逐句，先判定后证据和理由（style vfirst），与 e3 同数据只换顺序
task: ragtruth
style: vfirst
prompt_tips: false
base_model: /root/autodl-tmp/models/Qwen3-0.6B
use_lora: true
merge_lora: true
eos_tokens: ["<|im_end|>"]
lora:
  r: 16
  lora_alpha: 32
  target_modules: all-linear
  task_type: CAUSAL_LM

trainer:
  num_train_epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  bf16: true
  gradient_checkpointing: true
  max_length: 4096
  logging_steps: 5
  save_strategy: "no"
  report_to: none
  seed: 0
  model_init_kwargs:
    dtype: bfloat16
    device_map: cuda

coldstart:
  data: outputs/rt/claims/train_sub35_nat.jsonl
  output_dir: /root/autodl-tmp/ckpt/sft-0.6b-e4
