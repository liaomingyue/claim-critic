# TRL GRPO + LoRA，2 × 24 GB，用于先跑通流程
init_model: outputs/ckpt/critic-0
data_dir: outputs/data/trainset_v{version}
output_dir: outputs/ckpt/grpo-trl-v{version}
prompts_per_step: 128
max_prompt_length: 6144   # TRL 1.x 不截断 prompt，超长的在组数据时丢掉；24 GB 卡吃紧时数据阶段用 split_claims --context_k 1

lora:
  r: 64
  lora_alpha: 128
  target_modules: all-linear
  task_type: CAUSAL_LM

trainer:                  # 传给 trl.GRPOConfig；字段名以所装 TRL 版本为准
  learning_rate: 2.0e-5
  num_generations: 8
  temperature: 1.0
  max_completion_length: 1024
  beta: 0.01
  max_steps: 300
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 64   # 2 卡 × 8 × 64 / 8 generations = 128 prompt/step
  shuffle_dataset: false            # 顺序已按类别平衡排好
  eval_strategy: steps
  eval_steps: 25
  bf16: true
  gradient_checkpointing: true
  use_vllm: true
  logging_steps: 1
  report_to: wandb
