# verl GRPO，8B 全参数，8 × H100
init_model: outputs/ckpt/critic-0     # 每轮都从冷启动模型起训
data_dir: outputs/data/trainset_v{version}
output_dir: outputs/ckpt/grpo-v{version}
project_name: claim-critic
experiment_prefix: grpo-8b

train_batch_size: 128     # prompt / step
ppo_mini_batch_size: 32
group_size: 8             # G
temperature: 1.0
max_prompt_length: 6144   # 被引用文献 + 2 篇对照文献 + 术语表，每篇约 1-1.4k token；context_k 调小可降回 3072
max_response_length: 1024
lr: 1.0e-6
kl_coef: 0.01
total_steps: 300
test_freq: 25
save_freq: 50

n_gpus: 8
rollout_tp: 2
rollout_gpu_mem: 0.6

lora_rank: 0              # >0 时走 verl 的 LoRA；建议 LoRA 用 grpo_trl.yaml
lora_alpha: 32

extra_overrides: {}       # 其他 hydra 参数，原样透传
